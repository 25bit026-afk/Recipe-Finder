<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore & Search Recipes - Recipe Finder</title>
    <meta name="description" content="Search hundreds of curated recipes by name, ingredient, cuisine, dietary category, and prep time with live filters.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/recipes.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <!-- Sticky Navigation Bar -->
    <header class="navbar">
        <div class="container navbar-container">
            <a href="index.html" class="brand-logo">
                <span class="brand-icon">🍳</span>
                <span>Recipe<span class="highlight">Finder</span></span>
            </a>

            <nav>
                <ul class="nav-menu">
                    <li><a href="index.html" class="nav-link"><i class="fas fa-home"></i> Home</a></li>
                    <li><a href="recipes.html" class="nav-link active"><i class="fas fa-utensils"></i> Recipes</a></li>
                    <li>
                        <a href="favorites.html" class="nav-link">
                            <i class="fas fa-heart"></i> Favorites
                            <span class="nav-badge fav-count-badge" style="display:none;">0</span>
                        </a>
                    </li>
                </ul>
            </nav>

            <div class="nav-actions">
                <button class="btn-icon theme-toggle-btn" aria-label="Toggle Dark / Light Theme" title="Toggle Theme">
                    <i class="fas fa-moon"></i>
                </button>
                <button class="btn btn-secondary btn-sm btn-random-recipe">
                    🎲 Random
                </button>
                <button class="btn-icon btn-mobile-toggle" id="mobileMenuToggle" aria-label="Open Navigation Menu">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Mobile Drawer Menu -->
    <div class="mobile-nav-overlay" id="mobileOverlay"></div>
    <aside class="mobile-nav-drawer" id="mobileDrawer">
        <div class="mobile-nav-header">
            <a href="index.html" class="brand-logo">
                <span class="brand-icon">🍳</span>
                <span>Recipe<span class="highlight">Finder</span></span>
            </a>
            <button class="btn-icon" id="closeMobileDrawer" aria-label="Close Menu">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <ul class="mobile-nav-links">
            <li><a href="index.html" class="nav-link"><i class="fas fa-home"></i> Home</a></li>
            <li><a href="recipes.html" class="nav-link active"><i class="fas fa-utensils"></i> Explore Recipes</a></li>
            <li>
                <a href="favorites.html" class="nav-link">
                    <i class="fas fa-heart"></i> Saved Favorites
                    <span class="nav-badge fav-count-badge" style="display:none;">0</span>
                </a>
            </li>
        </ul>
        <div style="margin-top:auto; padding-top:20px; border-top:1px solid var(--border-subtle);">
            <button class="btn btn-primary btn-random-recipe" style="width:100%;">
                🎲 Surprise Me!
            </button>
        </div>
    </aside>

    <main class="container">
        <div class="search-page-layout">
            <!-- Filter Sidebar -->
            <aside class="filter-sidebar">
                <div class="filter-header">
                    <h3><i class="fas fa-sliders-h" style="color:var(--primary);"></i> Filters</h3>
                    <button class="btn-reset-filters" id="resetFiltersBtn">Reset All</button>
                </div>

                <!-- Cuisine Filter -->
                <div class="filter-group">
                    <label class="filter-label" for="filterCuisine">Cuisine</label>
                    <select class="filter-select" id="filterCuisine">
                        <option value="all">All Cuisines</option>
                        <option value="Indian">🍛 Indian</option>
                        <option value="Italian">🍝 Italian</option>
                        <option value="Chinese">🥢 Chinese</option>
                        <option value="Mexican">🌮 Mexican</option>
                        <option value="Japanese">🍱 Japanese</option>
                        <option value="Mediterranean">🥗 Mediterranean</option>
                        <option value="American">🍔 American</option>
                        <option value="Thai">🍲 Thai</option>
                    </select>
                </div>

                <!-- Diet Filter -->
                <div class="filter-group">
                    <label class="filter-label" for="filterDiet">Dietary Preference</label>
                    <select class="filter-select" id="filterDiet">
                        <option value="all">All Diets</option>
                        <option value="Vegetarian">🌱 Vegetarian / Vegan</option>
                        <option value="Non-Vegetarian">🍗 Non-Vegetarian</option>
                        <option value="Vegan">🥑 Strict Vegan</option>
                        <option value="Pescatarian">🐟 Pescatarian</option>
                    </select>
                </div>

                <!-- Cooking Time Filter -->
                <div class="filter-group">
                    <label class="filter-label" for="filterTime">Cooking Time</label>
                    <select class="filter-select" id="filterTime">
                        <option value="all">Any Cooking Time</option>
                        <option value="20">⚡ Under 20 Minutes</option>
                        <option value="30">⏱️ Under 30 Minutes</option>
                        <option value="45">⏱️ Under 45 Minutes</option>
                        <option value="60">⏳ 45+ Minutes</option>
                    </select>
                </div>

                <!-- Difficulty Filter -->
                <div class="filter-group">
                    <label class="filter-label" for="filterDifficulty">Difficulty</label>
                    <select class="filter-select" id="filterDifficulty">
                        <option value="all">Any Difficulty</option>
                        <option value="Easy">🟢 Easy</option>
                        <option value="Medium">🟡 Medium</option>
                        <option value="Hard">🔴 Advanced</option>
                    </select>
                </div>

                <!-- Spicy Level Filter -->
                <div class="filter-group">
                    <label class="filter-label">Spiciness</label>
                    <div class="filter-chips-wrap">
                        <button class="filter-chip spicy-filter-chip active" data-spicy="all">All</button>
                        <button class="filter-chip spicy-filter-chip" data-spicy="1">Mild 🌶️</button>
                        <button class="filter-chip spicy-filter-chip" data-spicy="2">Med 🌶️🌶️</button>
                        <button class="filter-chip spicy-filter-chip" data-spicy="3">Hot 🌶️🌶️🌶️</button>
                        <button class="filter-chip spicy-filter-chip" data-spicy="4">Fiery 🔥</button>
                    </div>
                </div>
            </aside>

            <!-- Main Results Area -->
            <section class="search-main-content">
                <!-- Search Top Controls -->
                <div class="search-controls-bar">
                    <div class="search-input-field">
                        <i class="fas fa-search" style="color:var(--text-muted);"></i>
                        <input type="text" id="searchQueryInput" placeholder="Search by recipe title or ingredients (e.g. Chicken, Garlic, Tomato)..." autocomplete="off">
                    </div>

                    <div class="search-sort-wrap">
                        <select class="filter-select" id="sortBySelect" style="width: auto; min-width: 170px;">
                            <option value="rating">⭐ Highest Rated</option>
                            <option value="popular">🔥 Most Popular</option>
                            <option value="time-asc">⏱️ Quickest First</option>
                            <option value="time-desc">⏳ Longest First</option>
                            <option value="name">🔤 Alphabetical (A-Z)</option>
                        </select>

                        <div class="view-toggle-btns">
                            <button class="btn-view-toggle active" id="viewGridBtn" title="Grid View" aria-label="Grid View">
                                <i class="fas fa-th-large"></i>
                            </button>
                            <button class="btn-view-toggle" id="viewListBtn" title="List View" aria-label="List View">
                                <i class="fas fa-list"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Active Filters Chips & Counter -->
                <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 10px;">
                    <div class="active-filters-row" id="activeFiltersList"></div>
                    <span id="resultsCountBadge" style="font-size: 0.88rem; font-weight: 700; color: var(--text-secondary);">
                        Loading recipes...
                    </span>
                </div>

                <!-- Recipe Cards Grid -->
                <div class="recipes-grid" id="searchResultsGrid">
                    <!-- Populated dynamically by search.js -->
                </div>
            </section>
        </div>
    </main>

    <!-- Random Recipe Modal -->
    <div class="modal-overlay" id="randomRecipeModal">
        <div class="modal-card">
            <button class="modal-close-btn" id="closeRandomModal" aria-label="Close modal">
                <i class="fas fa-times"></i>
            </button>
            <div id="randomModalContent"></div>
        </div>
    </div>

    <!-- Back to Top Button -->
    <button class="btn-back-to-top" id="backToTopBtn" aria-label="Back to top" title="Back to top">
        <i class="fas fa-chevron-up"></i>
    </button>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom" style="border-top:none; padding-top:0;">
                <div>Recipe Finder © 2026 by <strong>VACK Technology</strong>. All rights reserved.</div>
                <div>Filter & Discover Delicious Global Cuisine • Powered by <strong>VACK Technology</strong></div>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/search.js"></script>
</body>
</html>
